apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 'argexfil'
spec:
  destination:
    namespace: com
    server: https://kubernetes.default.svc
  source:
    path: 'manifests'
    repoURL: 'https://github.com/Future-Sight-Group/Argexfil.git'
    targetRevision: HEAD
  project: 'default'
  syncPolicy:
      syncOptions:
        - CreateNamespace=true
      automated:
        prune: false
        selfHeal: false
